### default prefix key: <C-q>
#   Reload tmux config in session, using <prefix> + r (here is <C-q> + r)
#   Reload tmux config in the out of tmux, using `source-file ~/.tmux.conf` (here is <C-q> + R)

unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind r
bind r source-file ~/.tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z

# change cursor between windows
# bind -n C-h select-pane -L
# bind -n C-j select-pane -D
# bind -n C-k select-pane -U
# bind -n C-l select-pane -R


set -g mouse on
set -g mode-keys vi
set -sg escape-time 0 # make delay shorter

### Copy Mode
bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"


### Plugins 
# tmux plugins manager
set -g @plugin 'tmux-plugins/tpm'
# 
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'

# navigator between vim and tmux
# set -g @plugin 'tmux-plugins/vim-tmux-navigator'
set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @catppuccin_flavour 'macchiato'

# unbind C-b
unbind C-b
# set C-q as prefix
set-option -g prefix C-q
bind-key C-q send-prefix

# right click paste
bind-key -n MouseDown3Pane run "tmux set-buffer \"$(xclip -o -sel clip)\"; tmux paste-buffer"

run '~/.tmux/plugins/tpm/tpm' # Initialize TPM
