# Performance
repaint_delay                   6
input_delay                     1
sync_to_monitor                 no
update_check_interval           0

# Font
font_family                     Monaco
font_family                     Maple Mono NF CN
bold_font                       auto
italic_font                     Monaco
bold_italic_font                auto
font_size                       17
disable_ligatures               never

# Mouse and clipboard
copy_on_select                  yes
strip_trailing_spaces           always
open_url_modifiers              cmd

# Cursor
cursor_shape                    block
cursor_blink_interval           0.5
# Shell integration
shell_integration               enabled no-cursor

# Window
window_border_width             1px
window_padding_width            15
scrollback_lines                20000
background_opacity              0.95
background_blur                 50
macos_titlebar_color            background

# Bell
enable_audio_bell               no
window_alert_on_bell            yes
bell_on_tab                     no

# Tabs
tab_bar_edge                    bottom
tab_bar_style                   powerline
tab_powerline_style             angled
tab_bar_min_tabs                1
tab_bar_align                   left

foreground                      #dcdfe4
background                      #1e222a
selection_foreground            #dcdfe4
selection_background            #405060
cursor                          #96c4fe
url_color                       #61afef

color0                          #1e222a
color1                          #e06c75
color2                          #98c379
color3                          #e5c07b
color4                          #61afef
color5                          #c678dd
color6                          #56b6c2
color7                          #dcdfe4
color8                          #545862
color9                          #e06c75
color10                         #98c379
color11                         #e5c07b
color12                         #61afef
color13                         #c678dd
color14                         #56b6c2
color15                         #ffffff

# Border and tab colors
active_border_color             #61afef
inactive_border_color           #1e222a
active_tab_foreground           #1e222a
active_tab_background           #61afef
active_tab_font_style           bold
inactive_tab_foreground         #dcdfe4
inactive_tab_background         #1e222a
inactive_tab_font_style         normal

# Kitty-native keymaps (no prefix)
map alt+c new_tab
map alt+n next_tab
map alt+p previous_tab
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

map alt+enter new_window_with_cwd
map alt+right launch --location=vsplit --cwd=current
map alt+down launch --location=hsplit --cwd=current

map ctrl+h neighboring_window left
map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map ctrl+l neighboring_window right

map alt+shift+h move_window left
map alt+shift+j move_window down
map alt+shift+k move_window up
map alt+shift+l move_window right

map alt+shift+j resize_window taller 5
map alt+shift+k resize_window shorter 5
map alt+shift+h resize_window narrower 5
map alt+shift+l resize_window wider 5

map alt+m toggle_layout stack
map alt+shift+enter toggle_layout splits

# navigator
map ctrl+h neighboring_window left
map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map ctrl+l neighboring_window right
map --when-focus-on var:IS_VIM=true ctrl+h
map --when-focus-on var:IS_VIM=true ctrl+j
map --when-focus-on var:IS_VIM=true ctrl+k
map --when-focus-on var:IS_VIM=true ctrl+l

allow_remote_control yes
listen_on unix:/tmp/mykitty
