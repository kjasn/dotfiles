# Performance
repaint_delay                   6
input_delay                     1
sync_to_monitor                 no
update_check_interval           0
enabled_layouts                 splits

# Font
font_family                     Monaco
# font_family                     Maple Mono NF CN
bold_font                       Maple Mono NF CN
italic_font                     Maple Mono NF CN
bold_italic_font                auto
font_size                       17
disable_ligatures               never

# Mouse and clipboard
clipboard_control write-clipboard read-clipboard
copy_on_select                  yes
strip_trailing_spaces           always
open_url_modifiers              cmd

# Cursor
cursor_shape                    block
cursor_blink_interval           0.5
# Shell integration
shell_integration               enabled no-cursor
# set cursor trail, to disable set `cursor_trail` to 0
cursor_trail                    1
cursor_trail_color              none
cursor_trail_decay              0.1 0.4
cursor_trail_start_threshold    2


# Window
window_border_width             1px
window_padding_width            7
scrollback_lines                20000
background_opacity              0.85
background_blur                 50
hide_window_decorations         titlebar-only

# Bell
enable_audio_bell               no
window_alert_on_bell            yes
bell_on_tab                     no

# Tabs
tab_bar_edge                    bottom
tab_bar_style                   powerline
tab_powerline_style             angled
tab_bar_min_tabs                1
tab_bar_align                   left


# Tab fonts
active_tab_font_style           bold
inactive_tab_font_style         normal

# kitty-native keymaps (no prefix)
map alt+c new_tab
# map alt+n next_tab
# map alt+p previous_tab
map alt+] next_tab
map alt+[ previous_tab
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

map alt+enter new_window_with_cwd
map alt+right launch --location=vsplit --cwd=current
map alt+down launch --location=hsplit --cwd=current

map alt+, set_tab_title

map ctrl+h neighboring_window left
map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map ctrl+l neighboring_window right

# map alt+m toggle_layout stack
map alt+shift+enter toggle_layout splits

# navigator
map ctrl+h neighboring_window left
map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map ctrl+l neighboring_window right
map --when-focus-on var:IS_VIM=true ctrl+h
map --when-focus-on var:IS_VIM=true ctrl+j
map --when-focus-on var:IS_VIM=true ctrl+k
map --when-focus-on var:IS_VIM=true ctrl+l

allow_remote_control yes
listen_on unix:/tmp/mykitty


# BEGIN_KITTY_THEME
# Catppuccin-Macchiato
include current-theme.conf
# END_KITTY_THEME
